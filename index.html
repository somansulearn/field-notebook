<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>जनगणना फील्ड नोटबुक</title>
<meta name="description" content="जनगणना 2027 प्रगणकों के लिए ऑफलाइन फील्ड नोटबुक — आधिकारिक ऐप नहीं">
<meta name="theme-color" content="#0b4a8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#f4f2ec;--card:#fff;--ink:#16191d;--mut:#5d636b;--line:#d8d4ca;--acc:#0b4a8b;--acc2:#e7eef8;--ok:#1d7a3a;--okbg:#e3f3e7;--warn:#a35b00;--warnbg:#fff1db;--bad:#b42318;--badbg:#fde8e6;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Noto Sans Devanagari","Noto Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 12px 120px}
.top{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;margin:0 -12px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;flex:1;line-height:1.25;min-width:0}
.top h1 small{display:block;font-size:13px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:17px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label.l{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid #b9b4a8;border-radius:10px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid #9cc2f0;border-color:var(--acc)}
input.sm{width:5.2em}input.md{width:7.5em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--acc);background:#fff;color:var(--acc);font-weight:600}
.btn.p{background:var(--acc);color:#fff}
.btn.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.w{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{min-height:44px;padding:6px 12px;border-radius:22px;border:1.5px solid #a9a395;background:#fff;text-align:left}
.chip i{font-style:normal;font-size:13px;color:var(--mut);margin-left:2px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on i{color:#d7e6f8}
.chip.sug{border-style:dashed;border-color:var(--acc)}
.chip .rk{display:inline-block;background:#fff;color:var(--acc);border-radius:50%;width:22px;height:22px;text-align:center;font-size:13px;line-height:22px;margin-right:4px;font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid #c9c3b6;border-radius:10px;padding:10px 12px;margin:10px 0}
.q.ok{border-left-color:var(--ok)}
.q h4{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.q h4 .n{background:var(--acc2);color:var(--acc);border-radius:6px;padding:0 7px;font-size:14px;font-weight:700;flex:none}
.q.ok h4 .n{background:var(--okbg);color:var(--ok)}
.q h4 .t{flex:1}
.na{color:var(--mut);font-size:14px;padding:4px 12px;margin:4px 0;border-left:3px dashed var(--line)}
.warn{color:var(--warn);background:var(--warnbg);border-radius:8px;padding:4px 8px;font-size:14px;margin-top:6px}
.hint{color:var(--mut);font-size:13px;margin-top:4px}
.sec{position:sticky;top:64px;z-index:9;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg)}
.sec button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;min-height:38px;font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px}
.mchip{flex:none;border:1.5px solid #a9a395;background:#fff;border-radius:12px;padding:6px 10px;min-height:52px;text-align:left;max-width:170px}
.mchip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip span{font-size:12px;color:var(--mut)}
.mchip.on{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 2px var(--acc) inset}
.mchip.done span{color:var(--ok);font-weight:700}
.mchip.add{border-style:dashed;color:var(--acc);font-weight:700;min-width:64px;text-align:center}
.hh{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0}
.hh .h1{font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.pill.new{background:#eee;color:#555}.pill.part{background:var(--warnbg);color:var(--warn)}.pill.done{background:var(--okbg);color:var(--ok)}.pill.ent{background:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.banner{background:var(--warnbg);color:#5a3400;border:1px solid #f0c98a;border-radius:var(--r);padding:10px 12px;margin:12px 0}
.banner.bad{background:var(--badbg);border-color:#f2b8b2;color:#7a1610}
.fab{position:fixed;right:16px;bottom:18px;z-index:30;border-radius:28px;min-height:56px;padding:0 22px;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,520px);max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
#lock{position:fixed;inset:0;z-index:100;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lock[hidden]{display:none}
#lock input{max-width:220px;text-align:center;font-size:28px;letter-spacing:8px}
table.map{border-collapse:collapse;width:100%;font-size:14px}table.map td,table.map th{border:1px solid var(--line);padding:4px}
.who{font-size:12px;color:var(--mut)}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
#print{display:none}
/* ---------- Print / transfer sheet ---------- */
.ps{background:#fff;color:#000;font-size:13px;line-height:1.35}
.ps .phh{border:1.5px solid #000;padding:8px;margin:0 0 14px;page-break-after:always}
.ps .phh:last-child{page-break-after:auto}
.ps h2{font-size:16px;margin:0 0 4px}
.ps .loc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-bottom:6px}
.ps .loc b{font-size:13px}
.ps .tw{overflow-x:auto}.ps .tw table{min-width:640px}
.ps table{border-collapse:collapse;width:100%;margin:4px 0 8px}
.ps th,.ps td{border:1px solid #444;padding:3px 4px;vertical-align:top;text-align:left}
.ps th{background:#eee;font-size:11px}
.ps .pm{border:1px solid #444;margin:6px 0;padding:4px 6px;page-break-inside:avoid}
.ps .pm h3{font-size:14px;margin:0 0 3px;background:#eee;padding:2px 4px}
.ps .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px 12px}
.ps .kv div{border-bottom:1px dotted #bbb;padding:1px 0}
.ps .kv b{font-weight:700}
.ps .qn{display:inline-block;min-width:22px;font-weight:700}
.ps .tick{font-size:12px;margin-top:4px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.ps .kv{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  #app,#toast,#lock,dialog,.noprint{display:none!important}
  #print{display:block!important}
  .ps{font-size:11.5px}
  .ps .tw table{min-width:0}
  .ps .kv{grid-template-columns:repeat(2,1fr)}
  @page{size:A4;margin:10mm}
}

.sugbox{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.sugbox[hidden]{display:none}
.sgi{min-height:42px;border:1.5px solid var(--acc);background:var(--acc2);color:var(--ink);border-radius:21px;padding:4px 14px;font-size:17px}
.sgi i{font-style:normal;font-size:13px;color:var(--mut);margin-left:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="lists" hidden></div>
<div id="lock" hidden><div style="font-size:20px;font-weight:700">🔒 फील्ड नोटबुक</div><div>PIN डालें</div><input id="lock-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
<div id="toast" role="status"></div>

/* Countries — Q 8, 11, 12, 26, 27, 30, 34 */

/* Mother tongue directory — code = position (1..261) */

function resolveCombo(list, text) {

function placeTxt(f, p) {
  const t = f[p + '_t']; if (!t) return '';
  if (t === 'here') return 'यहीं ✓'; if (t === 'cur') return 'वर्तमान पते के समान ✓'; if (t === 'head') return 'मुखिया के समान ✓';
  if (t === 'out') return `भारत के बाहर: ${f[p + '_c_n'] || ''}${f[p + '_c'] ? ' (' + f[p + '_c'] + ')' : ''}`;
  const st = f[p + '_st']; const S0 = C.STATES.find(s => s.c === st);
  const stT = st === 'X' ? `${f[p + '_stn'] || ''} (${pad2(f[p + '_stx'] || '?')})` : S0 ? `${S0.n} (${pad2(st)})` : '';
  const dt = f[p + '_dt']; const dtT = (dt === 'X' || st === 'X') ? `${f[p + '_dtn'] || ''}${f[p + '_dtx'] ? ' (' + pad2(f[p + '_dtx']) + ')' : ''}` : S0 && dt ? `${lab(S0.d, dt)} (${pad2(dt)})` : '';
  return `भारत: राज्य ${stT}${dtT ? ', जिला ' + dtT : ''}${f[p + '_vil'] ? ', गाँव/नगर: ' + f[p + '_vil'] : ''}${f[p + '_addr'] ? ', ' + f[p + '_addr'] : ''}`;
}
const comboTxt = (f, k) => (f[k + '_n'] || f[k]) ? `${f[k + '_n'] || ''}${f[k] ? ' (' + f[k] + ')' : ''}` : '';
function personTxt(hh, f, p, full) {
  const id = f[p + '_id']; if (id && id !== 'OUT') { const x = memById(hh, id); return x ? `इसी परिवार में — क्र.सं. ${serial(hh, id)} (${x.f.name || ''})` : '?'; }
  if (!f[p + '_nm']) return '';
  let s = `${f[p + '_nm']}`; if (!full) return s;
  const dob = [f[p + '_dd'], f[p + '_dm'], f[p + '_dy']].map(x => x || '__').join('-');
  s += ` · ज.ति. ${dob} · जन्म स्थान: ${placeTxt(f, p + '_pl') || '—'} · धर्म: ${f[p + '_rg'] === 'O' ? 'अन्य: ' + (f[p + '_rgo'] || '') : withCode(C.RELG, f[p + '_rg']) || '—'}`;
  return s;
}
const yn = (f, a, v, mask) => f[a] === '1' ? `हाँ (1) — ${mask && f[v] ? '••••' + String(f[v]).slice(-4) : (f[v] || '')}` : f[a] === '2' ? 'नहीं (2)' : '';
function q10Txt(f) {
  const out = [];
  if (f.sc) out.push(`10क अ.जा.: ${withCode(C.YN, f.sc)}${f.sc === '1' ? ` ${f.sc_n || ''} [${f.sc_c || ''}]` : ''}`);
  if (f.st) out.push(`10ख अ.ज.जा.: ${withCode(C.YN, f.st)}${f.st === '1' ? ` ${f.st_n || ''} [${f.st_c || ''}]` : ''}`);
  if (f.caste_o) out.push(`10ग: ${f.caste_o === 'name' ? f.caste_n || '' : f.caste_o === 'nb' ? 'नहीं बताना चाहते' : 'कोई जाति नहीं'}`);
  return out.join('<br>');
}
function memberPrint(m, hh, opt) {

  add(11, personTxt(hh, f, 'fa', true)); add(12, personTxt(hh, f, 'mo', true));
  add(13, f.dis === '1' ? `हाँ (1) — प्रकार: ${(f.dis_t || []).map(c => withCode(C.DIS, c)).join(', ')}` : withCode(C.YN, f.dis));
  add(14, [comboTxt(f, 'mt'), f.l1 || f.l1_n ? 'ख: ' + comboTxt(f, 'l1') : '', f.l2 || f.l2_n ? 'ग: ' + comboTxt(f, 'l2') : ''].filter(Boolean).join(' · '));

  add(26, placeTxt(f, 'b26')); add(27, [placeTxt(f, 'p27'), f.p27_ru ? withCode(C.RU, f.p27_ru) : ''].filter(Boolean).join(' · '));

  return `<div class="pm"><h3>क्र.सं. ${serial(hh, m.id)} — ${esc(f.name || '')} (प्र. 11–40)</h3><div class="kv">${rows.join('')}</div></div>`;
}

const CSV_KEYS = ['name', 'rel', 'sex', 'dob_d', 'dob_m', 'dob_y', 'age', 'mar', 'mage', 'sp_id', 'sp_nm', 'nat', 'nat_c', 'nat_c_n', 'relg', 'relg_o', 'sc', 'sc_c', 'sc_n', 'st', 'st_c', 'st_n', 'caste_o', 'caste_n',
  'fa_id', 'fa_nm', 'fa_dd', 'fa_dm', 'fa_dy', 'fa_pl_t', 'fa_pl_st', 'fa_pl_dt', 'fa_pl_vil', 'fa_pl_c', 'fa_rg', 'fa_rgo', 'mo_id', 'mo_nm', 'mo_dd', 'mo_dm', 'mo_dy', 'mo_pl_t', 'mo_pl_st', 'mo_pl_dt', 'mo_pl_vil', 'mo_pl_c', 'mo_rg', 'mo_rgo',
  'dis', 'dis_t', 'mt', 'mt_n', 'l1', 'l1_n', 'l2', 'l2_n', 'lit', 'dlit', 'e16', 'e17a', 'e17b', 'w18', 'w19', 'occ', 'ind', 'c22', 'n23', 's24', 'km25', 'h25', 'mi25', 'm25',
  'b26_t', 'b26_st', 'b26_dt', 'b26_vil', 'b26_c', 'p27_t', 'p27_st', 'p27_dt', 'p27_vil', 'p27_c', 'p27_ru', 'r28', 'd29', 'pm_t', 'pm_st', 'pm_dt', 'pm_vil', 'pm_addr', 'pm_c',
  'c31d', 'c31s', 'c32d', 'c32s', 'c33d', 'c33s', 'cov', 'cv_t', 'cv_st', 'cv_dt', 'cv_c', 'bank', 'mob_a', 'mob', 'adh_a', 'adh', 'ep_a', 'epic', 'pp_a', 'pp', 'dl'];
function toCSV(hhs) {
  const H = ['block_eb', 'owner', 'bhawan', 'census_house_no', 'household_no', 'makan', 'mohalla', 'htype', 'self_enum_id', 'serial', ...CSV_KEYS, 'status'];
  const q = v => { v = Array.isArray(v) ? v.join(' ') : String(v ?? ''); if (/^\d{10,}$/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const lines = [H.join(',')];
  for (const h of hhs) { const b = S.blocks.find(x => x.id === h.f.blockId) || { f: {} };
    mems(h).forEach((m, i) => { const f = { ...m.f }; for (const p of ['sp', 'fa', 'mo']) if (f[p + '_id'] && f[p + '_id'] !== 'OUT') f[p + '_id'] = serial(h, f[p + '_id']);
      lines.push([b.f.eb, b.f.owner, h.f.bhawan, h.f.chs, h.f.hno, h.f.makan, h.f.mohalla, h.f.htype, h.f.sid, i + 1, ...CSV_KEYS.map(k => f[k]), hhStatus(h)[1]].map(q).join(',')); }); }
  return '﻿' + lines.join('\r\n');
}

function exportObj(blockIds) {
  const blocks = S.blocks.filter(b => blockIds.includes(b.id));
  const hhs = S.hhs.filter(h => blockIds.includes(h.f.blockId));
  return { app: 'census2027-field-notebook', v: 1, at: Date.now(), by: me(), blocks, hhs };
}
const stamp = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };
async function deliver(name, text, mime, share) {
  const blob = new Blob([text], { type: mime }); const file = new File([blob], name, { type: mime });
  if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); return true;
}
async function doBackup(share) {
  await flush(); const b = block();
  const ids = share ? [b.id] : S.blocks.map(x => x.id);
  const nm = `census_${share ? 'share' : 'backup'}_EB${(b.f.eb || '0000').replace(/\W/g, '')}_${stamp()}.txt`; // ASCII name; .txt so WhatsApp/Bluetooth accept it
  const ok = await deliver(nm, JSON.stringify(exportObj(ids)), 'text/plain', share);

    const h = newEnt(f); h.members = []; h.ts = Date.now(); S.hhs.push(h); await saveHH(h); exist.add(key); n++;
  }
  S.imp = null; toast(`${n} परिवार जोड़े${skip ? `, ${skip} पहले से थे` : ''}`); go({ v: 'home' });
}

/* =================== PIN lock =================== */
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cn27:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function lock() { if (!S.meta.pin) return; const L = $('#lock'); L.hidden = false; const i = $('#lock-in'); i.value = ''; setTimeout(() => i.focus(), 50); }
$('#lock-in').addEventListener('input', async (e) => { const v = e.target.value; if (v.length >= 4 && await sha(v) === S.meta.pin) { $('#lock').hidden = true; e.target.value = ''; } });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); flush(); } else if (S.meta.pin && Date.now() - hiddenAt > 180000) lock(); });
window.addEventListener('pagehide', flush);
window.addEventListener('beforeprint', () => { if (S.route.v === 'hh') { const h = curHH(); if (h) $('#print').innerHTML = `<div class="ps">${hhPrint(h, S.pv || { mask: false })}</div>`; } });

/* =================== datalists =================== */
function refreshNames() {
  const h = curHH(); const el = $('#dl-names'); if (!el) return;
  const names = new Set(); S.hhs.forEach(x => { if (h && x.id !== h.id) return; mems(x).forEach(m => ['sp', 'fa', 'mo'].forEach(p => m.f[p + '_nm'] && names.add(m.f[p + '_nm']))); });
  el.innerHTML = [...names].map(n => `<option value="${esc(n)}">`).join('');
}
function buildLists() {
  const mk = (id, list) => `<datalist id="dl-${id}">${list.map(([c, n]) => `<option value="${esc(n)} — ${c}">`).join('')}</datalist>`;
  $('#lists').innerHTML = mk('MT', C.MT) + mk('CTY', C.CTY) + '<datalist id="dl-names"></datalist>';
}

/* =================== Latin letters → Hindi suggestions =================== */
// Devanagari → rough Latin, then both sides reduced to a sound-key, so "mohammad", "muhammad", "mohd" all find मोहम्मद.
const DV_C = { 'क': 'k', 'ख': 'kh', 'ग': 'g', 'घ': 'gh', 'ङ': 'n', 'च': 'ch', 'छ': 'chh', 'ज': 'j', 'झ': 'jh', 'ञ': 'n', 'ट': 't', 'ठ': 'th', 'ड': 'd', 'ढ': 'dh', 'ण': 'n', 'त': 't', 'थ': 'th', 'द': 'd', 'ध': 'dh', 'न': 'n', 'प': 'p', 'फ': 'ph', 'ब': 'b', 'भ': 'bh', 'म': 'm', 'य': 'y', 'र': 'r', 'ल': 'l', 'व': 'v', 'श': 'sh', 'ष': 'sh', 'स': 's', 'ह': 'h', 'ळ': 'l' };
const DV_N = { 'क': 'q', 'ख': 'kh', 'ग': 'g', 'ज': 'z', 'ड': 'r', 'ढ': 'rh', 'फ': 'f' };
const DV_V = { 'अ': 'a', 'आ': 'aa', 'इ': 'i', 'ई': 'ee', 'उ': 'u', 'ऊ': 'oo', 'ऋ': 'ri', 'ए': 'e', 'ऐ': 'ai', 'ओ': 'o', 'औ': 'au', 'ऑ': 'o' };
const DV_M = { 'ा': 'aa', 'ि': 'i', 'ी': 'ee', 'ु': 'u', 'ू': 'oo', 'ृ': 'ri', 'े': 'e', 'ै': 'ai', 'ो': 'o', 'ौ': 'au', 'ॉ': 'o' };
function roman(str, alt) {
  const ch = [...String(str).normalize('NFD')]; let out = '';
  for (let i = 0; i < ch.length; i++) {
    const c = ch[i];
    if (DV_C[c]) {
      let b = DV_C[c]; if (ch[i + 1] === '़') { i++; if (!(alt && (c === 'ड' || c === 'ढ'))) b = DV_N[c] || b; }
      out += b; const n = ch[i + 1];
      if (n === '्') { i++; continue; } if (DV_M[n]) { out += DV_M[n]; i++; continue; } out += 'a'; continue;
    }
    if (DV_V[c]) { out += DV_V[c]; continue; }
    if (c === 'ं' || c === 'ँ') { out += 'n'; continue; } if (c === 'ः') { out += 'h'; continue; }
    if (/[a-z]/i.test(c)) { out += c.toLowerCase(); continue; }
    out += ' ';
  }
  return out;
}
const nrm = (s) => { s = s.toLowerCase().replace(/[^a-z]/g, '').replace(/ph/g, 'f').replace(/x/g, 'ks').replace(/q/g, 'k').replace(/z/g, 'j').replace(/w/g, 'v').replace(/v/g, 'b').replace(/c(?!h)/g, 'k'); for (let i = 0; i < 2; i++) s = s.replace(/([kgcjtdpbsr])h/g, '$1'); return s; };
const vk = (s) => nrm(s).replace(/ee|ii/g, 'i').replace(/oo|uu/g, 'u').replace(/a/g, '').replace(/(.)\1+/g, '$1');
const sk = (s) => nrm(s).replace(/[aeiouy]/g, '').replace(/(.)\1+/g, '$1');
function mkEntry(d, c, alias) {
  const srcs = new Set([roman(d), roman(d, true)]); if (alias) srcs.add(alias.toLowerCase());
  const keys = [...srcs].map(x => { const w = x.split(/\s+/).filter(Boolean); return { v: vk(x), k: sk(x), w: w.map(y => [vk(y), sk(y)]) }; });
  return { d, c: c || '', keys };
}
const DICT = {};
function dictFor(kind) {
  if (['MT', 'CTY', 'SC', 'ST'].includes(kind)) return DICT[kind] || (DICT[kind] = C[kind].map(o => mkEntry(o[1], o[0], [o[2], (C.ALIAS[kind] || {})[o[0]]].filter(Boolean).join(' '))));
  if (DICT[kind] && DICT[kind].at === S.dictAt) return DICT[kind];
  const set = new Set(C.SEED[kind] || []); const add = (v) => { v = String(v || '').trim(); if (v) set.add(v); };
  const words = (v) => String(v || '').split(/\s+/).forEach(w => w.length > 1 && /[\u0900-\u097F]/.test(w) && set.add(w));
  for (const h of S.hhs) { if (h.f._del) continue;
    if (kind === 'names') { words(h.f.head0); }
    for (const m of h.members) { const f = m.f; if (f._del) continue;
      if (kind === 'names') ['name', 'sp_nm', 'fa_nm', 'mo_nm'].forEach(k => words(f[k]));
      else if (kind === 'occ' || kind === 'ind') add(f[kind]);
      else if (kind === 'caste') add(f.caste_n);
      else if (kind === 'vil') Object.keys(f).filter(k => k.endsWith('_vil')).forEach(k => add(f[k]));
    } }
  if (kind === 'vil') S.blocks.forEach(b => add(b.f.vil));
  const arr = [...set].map(v => { const [d, al] = v.split('~'); return mkEntry(d, '', al); }); arr.at = S.dictAt; return (DICT[kind] = arr);
}
function sugMatch(q, entries) {
  q = q.trim().replace(/^(mohd|md)\.?$/i, 'mohammad'); if (!q) return [];
  const dev = /[ऀ-ॿ]/.test(q), num = /^\d+$/.test(q); const tv = vk(q), ts = sk(q); const out = [];
  for (const e of entries) {
    let sc = 0;
    if (num) { if (e.c && +e.c === +q) sc = 9; }
    else if (dev) { if (e.d.startsWith(q)) sc = 6; else if (e.d.split(/[\s,]+/).some(w => w.startsWith(q))) sc = 5; }
    else for (const k of e.keys) {
      if (tv && k.v.startsWith(tv)) sc = Math.max(sc, k.v === tv ? 4.5 : 4);
      else if (tv && k.w.some(w => w[0].startsWith(tv))) sc = Math.max(sc, 3);
      else if (ts.length >= 2 && k.k.startsWith(ts)) sc = Math.max(sc, 2);
      else if (ts.length >= 2 && k.w.some(w => w[1].startsWith(ts))) sc = Math.max(sc, 1.5);
    }
    if (sc) out.push({ sc, d: e.d, c: e.c, exact: sc >= 4.5 || sc === 9 });
  }
  out.sort((a, b) => b.sc - a.sc || a.d.length - b.d.length);
  if (out.length > 1 && out[0].sc === out[1].sc) out.forEach(o => o.exact = false);
  return out.slice(0, 6);
}
const SUG = { box: null, input: null, items: [] };
function hideSug() { if (SUG.box) SUG.box.hidden = true; SUG.input = null; }
function showSug(t) {
  const kind = t.dataset.combo || t.dataset.sug; if (!kind) return;
  const token = kind === 'names'; const raw = t.value; const q = token ? (raw.match(/(\S*)$/) || ['', ''])[1] : raw;
  let items = q.trim().length >= (token ? 2 : 1) ? sugMatch(q, dictFor(kind)) : [];
  items = items.filter(it => it.d !== q.trim() && (token || `${it.d} — ${it.c}` !== raw.trim()));
  if (!items.length) return hideSug();
  if (!SUG.box) { SUG.box = document.createElement('div'); SUG.box.className = 'sugbox'; SUG.box.setAttribute('role', 'listbox'); }
  SUG.box.innerHTML = items.map((it, i) => `<button type="button" class="sgi" data-si="${i}">${esc(it.d)}${it.c ? ` <i>${esc(it.c)}</i>` : ''}</button>`).join('');
  t.insertAdjacentElement('afterend', SUG.box); SUG.box.hidden = false; SUG.input = t; SUG.items = items;
}
function pickSug(i) {
  const t = SUG.input, it = SUG.items[i]; if (!t || !it) return;
  if (t.dataset.combo) { t.value = it.c ? `${it.d} — ${it.c}` : it.d; hideSug(); t.blur(); return; }
  if (t.dataset.sug === 'names') t.value = t.value.replace(/\S*$/, it.d + ' '); else t.value = it.d;
  t.dispatchEvent(new Event('input', { bubbles: true })); hideSug(); t.focus();
  if (t.dataset.sug !== 'names') t.dispatchEvent(new Event('change', { bubbles: true }));
}
document.addEventListener('pointerdown', (ev) => { const b = ev.target.closest('.sgi'); if (!b) return; ev.preventDefault(); pickSug(+b.dataset.si); });
document.addEventListener('click', (ev) => { if (ev.target.closest('.sgi')) ev.stopPropagation(); }, true);
document.addEventListener('focusin', (ev) => { const t = ev.target; if (t.dataset && (t.dataset.sug !== undefined || t.dataset.combo !== undefined)) { S.dictAt = S.dictAt || Date.now(); showSug(t); } });
document.addEventListener('focusout', (ev) => { if (ev.target === SUG.input) setTimeout(() => { if (document.activeElement !== SUG.input) hideSug(); }, 150); S.dictAt = Date.now(); });
function scPick(p, list, m) {
  const f = m.f; const hit = C[list].find(o => o[0] === f[p + '_c']);
  let h = lbl(list === 'SC' ? 'अ.जा. — सूची से चुनें (हिंदी/English में लिखें)' : 'अ.ज.जा. — सूची से चुनें') + combo(p + '_c', list, m, { nk: p + '_n', ph: list === 'SC' ? 'जैसे: chamar, jatav, dhobi, balmiki…' : 'जैसे: tharu, buksa…' });
  if (hit && hit[3]) h += `<div class="warn">यह प्रविष्टि: ${esc(hit[3])}</div>`;
  h += `<div class="hint">कोड = उ.प्र. सूची का क्रमांक (3 अंक)। प्रशिक्षण ऐप से एक बार मिलान कर लें।</div>`;
  return h;
}
async function receiveInbox() {
  try {
    const c = await caches.open('fn-inbox'); const r = await c.match('./inbox'); if (!r) return;
    const txt = await r.text(); await c.delete('./inbox');
    if (!me()) { toast('पहले अपना नाम डालें, फिर फ़ाइल दोबारा शेयर करें'); return; }
    if (!confirm('शेयर की गई फ़ाइल को इस फोन के डेटा में मर्ज करें?')) return;
    mergeReport(await mergeData(JSON.parse(txt)));
  } catch (e) { alert('फ़ाइल मर्ज नहीं हुई: ' + e.message); }
}

/* =================== boot =================== */
(async function boot() {
  try { await DB.open(); } catch (e) { $('#app').innerHTML = `<div class="banner bad">स्टोरेज नहीं खुल सका: ${esc(e.message)}। Chrome में खोलें, Incognito में नहीं।</div>`; return; }
  [S.blocks, S.hhs, S.meta] = await Promise.all([DB.all('blocks'), DB.all('hh'), DB.get('meta', 'meta').then(x => x || {})]);
  if (!block() && S.blocks.length === 0) S.meta.curBlock = null; else if (!S.meta.curBlock || !S.blocks.find(b => b.id === S.meta.curBlock && !b.f._del)) S.meta.curBlock = block()?.id;
  const inbox = /inbox=1/.test(location.search);
  buildLists(); history.replaceState({ v: 'home' }, '', location.pathname); render(); lock();
  if (inbox) receiveInbox();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
